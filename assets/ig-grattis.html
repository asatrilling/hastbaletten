<!DOCTYPE html>
<html lang="sv"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:1080px;height:1080px;overflow:hidden}
 .card{position:relative;width:1080px;height:1080px;font-family:'Inter',sans-serif;overflow:hidden}
 img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 42%}
 .shade{position:absolute;inset:0;background:linear-gradient(180deg, rgba(18,24,20,.34) 0%, rgba(18,24,20,.04) 34%, rgba(18,24,20,.40) 66%, rgba(16,22,18,.90) 100%)}
 .top{position:absolute;top:64px;left:70px;color:#fff;font-family:'Playfair Display',serif;font-size:34px;font-weight:700;letter-spacing:.04em;text-shadow:0 2px 14px rgba(0,0,0,.6)}
 .content{position:absolute;left:70px;right:70px;bottom:78px;color:#fff}
 .kicker{font-size:25px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:#E7C07E;margin-bottom:18px;text-shadow:0 2px 10px rgba(0,0,0,.7)}
 h1{font-family:'Playfair Display',serif;font-weight:700;font-size:76px;line-height:1.02;text-shadow:0 3px 18px rgba(0,0,0,.6)}
 h1 .em{font-style:italic;color:#E7C07E}
 .sub{margin-top:18px;font-size:30px;line-height:1.35;color:#f3efe6;text-shadow:0 2px 12px rgba(0,0,0,.65)}
 .credit{margin-top:22px;font-family:'Playfair Display',serif;font-style:italic;font-size:30px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
 .credit b{font-style:normal;color:#E7C07E}
 .site{margin-top:26px;font-size:26px;font-weight:700;color:#E7C07E;text-shadow:0 2px 10px rgba(0,0,0,.6)}
</style></head>
<body><div class="card">
 <img class="bg" src="marknadsforing/jenny-canela-boekelo.jpg" alt="">
 <div class="shade"></div>
 <div class="top">Hästbaletten</div>
 <div class="content">
   <div class="kicker">Grattis · CCI4* Boekelo 2026</div>
   <h1>Jenny &amp; Canela<br><span class="em">12:a</span> av 92!</h1>
   <div class="sub">Debut på lång 4*-nivå · felfritt i både terräng och hoppning.</div>
   <div class="credit">Dressyrträning &amp; sadelanpassning: <b>Lena Lilja</b></div>
   <div class="site">lenalilja.se</div>
 </div>
</div></body></html>
