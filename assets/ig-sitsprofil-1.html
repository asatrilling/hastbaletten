<!DOCTYPE html>
<html lang="sv"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
 :root{--ink:#22302A;--gold:#E7C07E}
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:1080px;height:1080px;overflow:hidden}
 .card{position:relative;width:1080px;height:1080px;background:var(--ink);font-family:'Inter',sans-serif;display:flex;flex-direction:column;align-items:center;text-align:center;padding:66px 72px 54px}
 .kicker{font-size:23px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
 h1{font-family:'Playfair Display',serif;font-weight:700;font-size:74px;line-height:1.04;color:#fff;margin:16px 0 8px}
 h1 em{font-style:italic;color:var(--gold)}
 .frame{margin:30px 0 26px;width:100%;flex:1;border-radius:18px;overflow:hidden;border:3px solid rgba(231,192,126,.55);box-shadow:0 22px 50px rgba(0,0,0,.4)}
 .frame img{width:100%;height:100%;object-fit:cover;object-position:50% 58%}
 .sub{font-size:27px;line-height:1.4;color:#e9e3d6;max-width:760px}
 .sub b{color:#fff}
 .foot{margin-top:24px;font-family:'Playfair Display',serif;font-weight:600;font-size:30px;color:#fff;letter-spacing:.02em}
 .foot .d{color:var(--gold);margin:0 12px}
</style></head>
<body><div class="card">
 <div class="kicker">Sitsprofilen · Lenas egen metod</div>
 <h1>Se din sits <em>på skärm</em></h1>
 <div class="frame"><img src="tryckmatta.jpg" alt=""></div>
 <div class="sub">En tryckmatta visar hur du fördelar vikten via <b>sittbenen</b> – ojämnheter blir tydliga, och vägen till bättre balans kortare.</div>
 <div class="foot">Hästbaletten<span class="d">·</span>lenalilja.se</div>
</div></body></html>
