<!DOCTYPE html>
<html lang="sv"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:1080px;height:1080px;overflow:hidden}
 .card{position:relative;width:1080px;height:1080px;font-family:'Inter',sans-serif;overflow:hidden}
 img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:52% 14%}
 .shade{position:absolute;inset:0;background:linear-gradient(180deg, rgba(18,24,20,.45) 0%, rgba(18,24,20,.30) 40%, rgba(16,22,18,.86) 100%)}
 .top{position:absolute;top:64px;left:70px;color:#fff;font-family:'Playfair Display',serif;font-size:32px;font-weight:700;letter-spacing:.04em;text-shadow:0 2px 12px rgba(0,0,0,.5)}
 .content{position:absolute;left:70px;right:70px;bottom:120px;color:#fff}
 .kicker{font-size:26px;font-weight:600;letter-spacing:.30em;text-transform:uppercase;color:#E7C07E;margin-bottom:20px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
 h2{font-family:'Playfair Display',serif;font-weight:700;font-size:74px;line-height:1.04;text-shadow:0 3px 18px rgba(0,0,0,.55)}
 .cta{margin-top:30px;display:inline-block;background:#E7C07E;color:#1b2a22;font-weight:700;font-size:38px;padding:20px 40px;border-radius:999px}
</style></head>
<body><div class="card">
 <img class="bg" src="hero.png" alt="">
 <div class="shade"></div>
 <div class="top">Hästbaletten</div>
 <div class="content">
   <div class="kicker">Sadlar till salu</div>
   <h2>Se hela utbudet<br>med bilder &amp; priser</h2>
   <div class="cta">lenalilja.se</div>
 </div>
</div></body></html>
