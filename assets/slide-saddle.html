<!DOCTYPE html>
<html lang="sv"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:1080px;height:1080px;overflow:hidden}
 .card{position:relative;width:1080px;height:1080px;font-family:'Inter',sans-serif;overflow:hidden}
 img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%}
 .shade{position:absolute;inset:0;background:linear-gradient(180deg, rgba(18,24,20,.18) 0%, rgba(18,24,20,.00) 42%, rgba(18,24,20,.32) 74%, rgba(16,22,18,.90) 100%)}
 .top{position:absolute;top:64px;left:70px;color:#fff;font-family:'Playfair Display',serif;font-size:32px;font-weight:700;letter-spacing:.04em;text-shadow:0 2px 12px rgba(0,0,0,.5)}
 .badge{position:absolute;top:66px;right:70px;background:#E7C07E;color:#1b2a22;font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;padding:10px 20px;border-radius:999px}
 .content{position:absolute;left:70px;right:70px;bottom:76px;color:#fff}
 h2{font-family:'Playfair Display',serif;font-weight:700;font-size:62px;line-height:1.03;text-shadow:0 3px 16px rgba(0,0,0,.55)}
 .spec{margin-top:16px;font-size:30px;color:#efe9dd;text-shadow:0 2px 10px rgba(0,0,0,.6)}
 .price{margin-top:16px;font-family:'Playfair Display',serif;font-weight:700;font-size:50px;color:#E7C07E;text-shadow:0 2px 12px rgba(0,0,0,.5)}
</style></head>
<body><div class="card">
 <img class="bg" src="begagnade-sadlar/cortina-brun-1.jpg" alt="">
 <div class="shade"></div>
 <div class="top">Hästbaletten</div>
 <div class="badge">Begagnad</div>
 <div class="content">
   <h2>Amerigo Cortina Pinerolo</h2>
   <div class="spec">16,5" K +2 · Dressyr · brun</div>
   <div class="price">35 000 kr</div>
 </div>
</div></body></html>
