<!DOCTYPE html>
<html lang="sv"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:1080px;height:1920px;overflow:hidden}
 .card{position:relative;width:1080px;height:1920px;background:#22302A;font-family:'Inter',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 90px}
 .logo{width:300px;height:auto;background:#fff;border-radius:24px;padding:22px 26px;margin-bottom:54px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
 .name{font-family:'Playfair Display',serif;font-weight:700;font-size:92px;color:#fff;letter-spacing:.01em;line-height:1}
 .rule{width:90px;height:3px;background:#E7C07E;margin:34px 0}
 .tag{font-size:33px;color:#e9e3d6;letter-spacing:.04em;line-height:1.5}
 .tag .dot{color:#E7C07E;margin:0 10px}
 .site{margin-top:60px;font-family:'Playfair Display',serif;font-style:italic;font-size:58px;color:#E7C07E;font-weight:600}
</style></head>
<body><div class="card">
  <img class="logo" src="logga.jpg" alt="">
  <div class="name">Hästbaletten</div>
  <div class="rule"></div>
  <div class="tag">Sadelprovning<span class="dot">·</span>Sadlar till salu<br>Dressyrträning</div>
  <div class="site">lenalilja.se</div>
</div></body></html>
